buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24  // ML Kit requires 24+
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.22"
        // Force Google Play Services version for compatibility with react-native-geolocation-service
        // Using 18.0.0 to match the library's default and avoid interface/class conflicts
        googlePlayServicesVersion = "18.0.0"
        playServicesLocationVersion = "18.0.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.3.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22")
        classpath 'com.google.gms:google-services:4.4.1'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'
    }
}

apply plugin: "com.facebook.react.rootproject"

